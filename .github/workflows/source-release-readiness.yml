name: Source release readiness

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-release-readiness:
    name: Source release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit source release
        run: >-
          npm run release:audit --
          --output "${{ runner.temp }}/source-release-audit.json"

      - name: Generate package release plan
        run: >-
          npm run packages:plan --
          --output "${{ runner.temp }}/package-release-plan.json"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check independent package consumers
        run: npm run packages:check

      - name: Upload source-release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-release-audit
          path: |
            ${{ runner.temp }}/source-release-audit.json
            ${{ runner.temp }}/package-release-plan.json
          if-no-files-found: error
          retention-days: 14
